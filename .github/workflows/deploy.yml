name: Deploy Maritime Project

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug repo content
        run: |
          echo "Workspace:"
          pwd
          ls -lah


      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: 'maritimedeploy'
          password: 'asdf44534%%^dfgrgGdtUI9**unvG'
          port: 22
          source: "*"

          target: "/var/www/maritime-export.inplsoftwares.com"
          tar_tmp_path: "/tmp"
          debug: true

      - name: Post-Deployment Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: maritimedeploy
          password: 'asdf44534%%^dfgrgGdtUI9**unvG'
          script: |
            cd /var/www/maritime-export.inplsoftwares.com

            if [ -f composer.json ]; then
              php7.4 /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
            fi

            chmod -R 775 storage bootstrap/cache
            php7.4 artisan config:clear
            php7.4 artisan view:clear

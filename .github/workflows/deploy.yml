name: Deploy Maritime Project

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 1: Files copy karna (Is se permissions temporary kharab ho jati hain)
      - name: Copy project files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: 'maritimedeploy'
          password: 'asdf44534%%^dfgrgGdtUI9**unvG'
          # Sab files bhej raha hai siwaye vendor/git/node_modules ke
          source: ".,!node_modules,!vendor,!.git"
          target: "/var/www/maritime-export.inplsoftwares.com"
          rm: false # .env aur .htaccess ko delete hone se bachany ke liye
          strip_components: 0
          debug: true

      # Step 2: Permissions ko foran theek karna aur Laravel ko refresh karna
      - name: Post-Deployment Permissions & Cleanup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: 'maritimedeploy'
          password: 'asdf44534%%^dfgrgGdtUI9**unvG'
          script: |
            cd /var/www/maritime-export.inplsoftwares.com
            
            # 1. Ownership fix (maritimedeploy user aur www-data group)
            sudo chown -R maritimedeploy:www-data .

            # 2. Storage aur Cache folders ko write permission (775)
            sudo chmod -R 775 storage bootstrap/cache

            # 3. Log file ko special permission dena taake Laravel write kar saky
            if [ -f storage/logs/laravel.log ]; then
                sudo chmod 666 storage/logs/laravel.log
            fi

            # 4. Composer aur Laravel cache optimize karna
            if [ -f composer.json ]; then
                php7.4 /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
            fi
            
            php7.4 artisan config:cache
            php7.4 artisan route:cache
            php7.4 artisan view:clear

            echo "🚀 Deployment Successful and Permissions Restored!"

name: Laravel Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Upload via FTP
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}       # server IP or domain
          username: ${{ secrets.FTP_USERNAME }} # FTP user
          password: ${{ secrets.FTP_PASSWORD }} # FTP password
          local-dir: ./                         # repo root
          server-dir: ./
          passive: true
          protocol: ftp
          port: 21

name: Deploy Maritime Project

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Files upload karna (Password use ho raha hai)
      - name: Copy files via SFTP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: 'maritimedeploy'
          password: 'asdf44534%%^dfgrgGdtUI9**unvG' 
          port: 22
          source: "."
          target: "/var/www/maritime-export.inplsoftwares.com/"
          strip_components: 0
          tar_tmp_path: "/tmp"

      # 2. Permissions Fix aur Laravel Setup
      - name: Post-Deployment Execution
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: 'maritimedeploy'
          password: 'asdf44534%%^dfgrgGdtUI9**unvG'
          script: |
            cd /var/www/maritime-export.inplsoftwares.com
            
            # Permissions Fix
            find . -type d -exec chmod 775 {} \;
            find . -type f -exec chmod 664 {} \;
            
            # ACL ensure karna
            sudo setfacl -R -m u:www-data:rwx -m u:maritimedeploy:rwx storage bootstrap/cache
            sudo setfacl -Rd -m u:www-data:rwx -m u:maritimedeploy:rwx storage bootstrap/cache
            
            if [ -f .env ]; then
                php7.4 artisan config:clear
                php7.4 artisan route:clear
                php7.4 artisan view:clear
                php7.4 artisan cache:clear
            fi
            echo "Bhai, Maritime Export Deploy Ho Gaya!"

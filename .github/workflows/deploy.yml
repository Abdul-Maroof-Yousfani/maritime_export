name: Deploy Maritime Project

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Copy Laravel project via SCP
      - name: Copy project via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: 'maritimedeploy'
          password: 'asdf44534%%^dfgrgGdtUI9**unvG'
          # rm: true ko hata diya hai taake purani files (like .env) delete na hon
          rm: false 
          # Saari files bhej raha hai (Hidden files ke liye wildcard ya explicit name)
          source: ".,!node_modules,!vendor,!.git" 
          target: "/var/www/maritime-export.inplsoftwares.com"
          strip_components: 0
          debug: true
          

      # 3️⃣ Post-deploy commands via SSH
      - name: Post-deployment SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: 'maritimedeploy'
          password: 'asdf44534%%^dfgrgGdtUI9**unvG'
          script: |
            cd /var/www/maritime-export.inplsoftwares.com

            # Composer install (only if composer.json exists)
            if [ -f composer.json ]; then
                php7.4 /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
            fi

            # Permissions & Cache
            sudo chmod -R 775 storage bootstrap/cache
            php7.4 artisan config:clear
            php7.4 artisan view:clear

            echo "🚀 Deployment complete!"
